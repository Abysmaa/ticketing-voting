<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #fff; }
    .btn-primary { background: #334155; color: #fff; border: none; border-radius: 3px; padding: 12px 16px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; box-sizing: border-box; }
    .btn-outline { background:#fff; border:1px solid #cbd5e1; border-radius:3px; padding:12px 16px; font-size:13px; font-weight:600; color:#64748b; width:100%; box-sizing:border-box; }
  </style>
</helmet>
<div style="width:375px; height:600px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:32px;">
  <div style="width:64px; height:64px; border-radius:50%; background:#fee2e2; display:flex; align-items:center; justify-content:center;">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  </div>
  <div style="text-align:center; display:flex; flex-direction:column; gap:6px;">
    <div style="font-size:16px; font-weight:800; color:#0f172a;">Payment Failed</div>
    <div style="font-size:12px; color:#64748b;">Your payment could not be processed. No amount was charged.</div>
  </div>
  <div style="width:100%; display:flex; flex-direction:column; gap:10px;">
    <button class="btn-primary">Retry Payment</button>
    <button class="btn-outline">Back to Cart</button>
  </div>
</div>
</x-dc>

class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
