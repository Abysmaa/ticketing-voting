<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; }
    .lbl { font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    .field { border: 1px solid #cbd5e1; border-radius: 3px; background: #fff; padding: 10px 12px; font-size: 12px; color: #94a3b8; }
    .btn-primary { background: #334155; color: #fff; border: none; border-radius: 3px; padding: 11px 16px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; box-sizing: border-box; }
    .btn-google { background: #fff; border: 1px solid #cbd5e1; border-radius: 3px; padding: 10px 16px; font-size: 12px; font-weight: 600; color: #334155; width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .divider { display: flex; align-items: center; gap: 10px; color: #94a3b8; font-size: 11px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }
    a { color: #334155; text-decoration: none; font-weight: 600; } a:hover { color: #0f172a; }
  </style>
</helmet>
<div style="width:400px; height:640px; box-sizing:border-box; display:flex; align-items:center; justify-content:center;">
  <div style="width:320px; background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:32px 28px; display:flex; flex-direction:column; gap:14px;">
    <div style="display:flex; flex-direction:column; gap:2px; text-align:center;">
      <div style="font-size:17px; font-weight:800; color:#0f172a;">Create Account</div>
      <div style="font-size:11px; color:#94a3b8;">Save your tickets and check out faster</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <div><div class="lbl">Full Name</div><div class="field">John Doe</div></div>
      <div><div class="lbl">Email</div><div class="field">you@email.com</div></div>
      <div><div class="lbl">Password</div><div class="field">••••••••</div></div>
      <div><div class="lbl">Confirm Password</div><div class="field">••••••••</div></div>
    </div>
    <button class="btn-primary">Sign Up</button>
    <div class="divider">or</div>
    <button class="btn-google">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <div style="text-align:center; font-size:11px; color:#64748b;">Already have an account? <a href="#">Log in</a></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
