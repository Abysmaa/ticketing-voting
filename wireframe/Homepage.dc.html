<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; }
    .field { border: 1px solid #cbd5e1; border-radius: 3px; background: #fff; padding: 9px 12px; font-size: 12px; color: #94a3b8; }
    .chip { font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid #cbd5e1; color: #475569; }
    .chip-active { background: #334155; color: #fff; border-color: #334155; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
    .badge-free { font-size: 10px; font-weight: 700; background: #dcfce7; color: #166534; padding: 2px 7px; border-radius: 3px; }
  </style>
</helmet>
<div style="width:900px; height:600px; box-sizing:border-box; display:flex; flex-direction:column; overflow:hidden;">
  <div style="padding:16px 32px; border-bottom:1px solid #e2e8f0; background:#fff; display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
    <div style="font-weight:800; font-size:15px; color:#0f172a;">Ticketing</div>
    <div style="display:flex; gap:16px; align-items:center; font-size:12px; color:#475569;">
      <span>Browse Events</span>
      <span style="color:#334155; font-weight:700; border:1px solid #cbd5e1; border-radius:3px; padding:7px 14px;">Organizer Login</span>
    </div>
  </div>
  <div style="padding:20px 32px 12px; display:flex; flex-direction:column; gap:14px; flex-shrink:0;">
    <div class="field" style="width:100%; box-sizing:border-box;">Search event, city, or organizer...</div>
    <div style="display:flex; gap:8px;">
      <div class="chip chip-active">All</div>
      <div class="chip">Conference</div>
      <div class="chip">Workshop</div>
      <div class="chip">Festival</div>
      <div class="chip">Meetup</div>
    </div>
  </div>
  <sc-if value="{{hasResults}}" hint-placeholder-val="{{true}}">
    <div style="flex:1; padding:8px 32px 24px; display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:16px; overflow:hidden;">
      <sc-for list="{{events}}" as="ev" hint-placeholder-count="6">
        <div class="card">
          <div style="height:90px; background:#e2e8f0; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:10px;">banner</div>
          <div style="padding:10px 12px; display:flex; flex-direction:column; gap:6px;">
            <div style="font-size:12px; font-weight:700; color:#1e293b; line-height:1.3;">{{ev.title}}</div>
            <div style="font-size:10px; color:#94a3b8;">{{ev.date}} · {{ev.city}}</div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
              <span style="font-size:11px; font-weight:700; color:#1e293b;">{{ev.price}}</span>
              <sc-if value="{{ev.free}}" hint-placeholder-val="{{false}}"><span class="badge-free">FREE</span></sc-if>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:40px;">
      <div style="width:52px; height:52px; border-radius:50%; background:#f1f5f9; display:flex; align-items:center; justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </div>
      <div style="text-align:center; display:flex; flex-direction:column; gap:4px;">
        <div style="font-size:13px; font-weight:700; color:#1e293b;">No event found</div>
        <div style="font-size:11px; color:#94a3b8;">Try a different keyword or category</div>
      </div>
      <div style="font-size:11px; font-weight:600; color:#334155; text-decoration:underline; cursor:pointer;">Clear filters</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"hasResults":{"editor":"boolean","default":true,"section":"State"}}'>
class Component extends DCLogic {
  renderVals() {
    const hasResults = this.props.hasResults ?? true;
    return {
      hasResults,
      isEmpty: !hasResults,
      events: [
        { title: 'DevConf Jakarta 2026', date: 'Sep 12', city: 'Jakarta', price: 'From Rp 150,000', free: false },
        { title: 'React Workshop Batch 3', date: 'Sep 20', city: 'Bandung', price: 'From Rp 250,000', free: false },
        { title: 'Music Fest Weekend', date: 'Oct 3-5', city: 'Bali', price: 'From Rp 500,000', free: false },
        { title: 'Startup Meetup #12', date: 'Aug 30', city: 'Jakarta', price: 'Free', free: true },
        { title: 'UX Bootcamp', date: 'Sep 5', city: 'Surabaya', price: 'From Rp 100,000', free: false },
        { title: 'Community Run Club', date: 'Aug 28', city: 'Jakarta', price: 'Free', free: true },
      ],
    };
  }
}
</script>
</body>
</html>
