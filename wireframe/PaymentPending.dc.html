<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #fff; }
    .btn-primary { background: #334155; color: #fff; border: none; border-radius: 3px; padding: 12px 16px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; box-sizing: border-box; }
    .btn-outline { background:#fff; border:1px solid #cbd5e1; border-radius:3px; padding:12px 16px; font-size:13px; font-weight:600; color:#64748b; width:100%; box-sizing:border-box; }
  </style>
</helmet>
<div style="width:375px; height:640px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:32px;">
  <div style="width:64px; height:64px; border-radius:50%; background:#fef9c3; display:flex; align-items:center; justify-content:center;">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a16207" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>

  <div style="text-align:center; display:flex; flex-direction:column; gap:6px;">
    <div style="font-size:16px; font-weight:800; color:#0f172a;">Payment Pending</div>
    <div style="font-size:12px; color:#64748b;">Complete payment before it expires</div>
  </div>
  <div style="width:100%; background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:16px; display:flex; flex-direction:column; gap:6px; text-align:center;">
    <div style="font-size:10px; color:#94a3b8; text-transform:uppercase;">BCA Virtual Account</div>
    <div style="font-size:18px; font-weight:800; color:#0f172a; letter-spacing:.03em;">8808 1234 5678 90</div>
    <div style="font-size:11px; color:#dc2626;">Expires in 23:41</div>
  </div>
  <div style="width:100%; display:flex; flex-direction:column; gap:10px;">
    <button class="btn-primary">Refresh Status</button>
    <button class="btn-outline">Cancel Order</button>
  </div>
</div>
