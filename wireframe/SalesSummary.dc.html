<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; }
    .tab { font-size: 12px; font-weight: 600; padding: 10px 4px; color: #64748b; border-bottom: 2px solid transparent; }
    .tab-active { color: #0f172a; border-bottom: 2px solid #334155; }
    .stat-card { background:#fff; border:1px solid #e2e8f0; border-radius:6px; padding:14px 16px; display:flex; flex-direction:column; gap:4px; flex:1; }
    .stat-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #94a3b8; }
    .stat-val { font-size: 19px; font-weight: 800; color: #0f172a; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; }
  </style>
</helmet>
<div style="width:900px; height:600px; box-sizing:border-box; display:flex; flex-direction:column; background:#f1f5f9; overflow:hidden;">
  <div style="padding:16px 32px 0; border-bottom:1px solid #e2e8f0; background:#fff; display:flex; flex-direction:column; gap:10px; flex-shrink:0;">
    <div style="font-size:11px; color:#94a3b8;">Dashboard / Events / <span style="color:#334155; font-weight:600;">DevConf Jakarta 2026</span></div>
    <div style="display:flex; gap:20px;">
      <div class="tab tab-active">Sales Summary</div>
      <div class="tab">Attendees</div>
      <div class="tab">Report</div>
      <div class="tab">Ticket Types</div>
    </div>
  </div>
  <div style="flex:1; padding:24px 32px; display:flex; flex-direction:column; gap:20px; overflow:hidden;">
    <div style="display:flex; gap:16px;">
      <div class="stat-card"><div class="stat-lbl">Revenue</div><div class="stat-val">Rp 43,500,000</div></div>
      <div class="stat-card"><div class="stat-lbl">Tickets Sold</div><div class="stat-val">258 / 300</div></div>
      <div class="stat-card"><div class="stat-lbl">Avg. Ticket Price</div><div class="stat-val">Rp 168,600</div></div>
      <div class="stat-card"><div class="stat-lbl">Check-in Rate</div><div class="stat-val">78%</div></div>
    </div>
    <div class="card" style="display:flex; flex-direction:column;">
      <div style="padding:12px 16px; border-bottom:1px solid #e2e8f0; font-size:12px; font-weight:700; color:#1e293b;">Per Ticket-Type Breakdown</div>
      <div style="display:flex; padding:8px 16px; font-size:10px; text-transform:uppercase; color:#94a3b8; border-bottom:1px solid #f1f5f9;">
        <div style="width:40%;">Ticket Type</div><div style="width:20%;">Price</div><div style="width:20%;">Sold / Quota</div><div style="width:20%;">Revenue</div>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
        <div style="display:flex; padding:12px 16px; font-size:12px; color:#334155; border-bottom:1px solid #f8fafc;">
          <div style="width:40%; font-weight:600;">{{r.name}}</div><div style="width:20%;">{{r.price}}</div><div style="width:20%;">{{r.sold}}</div><div style="width:20%; font-weight:600;">{{r.revenue}}</div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { name: 'Early Bird', price: 'Rp 150,000', sold: '100 / 100', revenue: 'Rp 15,000,000' },
        { name: 'Regular', price: 'Rp 200,000', sold: '158 / 200', revenue: 'Rp 28,500,000' },
      ],
    };
  }
}
</script>
</body>
</html>
