<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; }
    .tab { font-size: 12px; font-weight: 600; padding: 10px 4px; color: #64748b; border-bottom: 2px solid transparent; }
    .tab-active { color: #0f172a; border-bottom: 2px solid #334155; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; }
  </style>
</helmet>
<div style="width:900px; height:600px; box-sizing:border-box; display:flex; flex-direction:column; background:#f1f5f9; overflow:hidden;">
  <div style="padding:16px 32px 0; border-bottom:1px solid #e2e8f0; background:#fff; display:flex; flex-direction:column; gap:10px; flex-shrink:0;">
    <div style="font-size:11px; color:#94a3b8;">Dashboard / Events / <span style="color:#334155; font-weight:600;">DevConf Jakarta 2026</span></div>
    <div style="display:flex; gap:20px;">
      <div class="tab">Sales Summary</div>
      <div class="tab">Attendees</div>
      <div class="tab tab-active">Report</div>
      <div class="tab">Ticket Types</div>
    </div>
  </div>
  <div style="flex:1; padding:24px 32px; display:flex; flex-direction:column; gap:16px; overflow:hidden;">
    <div class="card" style="padding:16px; display:flex; flex-direction:column; gap:14px; flex:1;">
      <div style="font-size:12px; font-weight:700; color:#1e293b;">Sales Over Time</div>
      <div style="flex:1; display:flex; align-items:flex-end; gap:10px; padding:0 4px;">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="10">
          <div style="flex:1; background:#334155; border-radius:2px 2px 0 0; height:{{b.h}};"></div>
        </sc-for>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:10px; color:#94a3b8;">
        <span>Aug 1</span><span>Aug 5</span><span>Aug 10</span><span>Aug 15</span><span>Aug 20</span>
      </div>
    </div>
    <div style="display:flex; gap:16px;">
      <div class="card" style="flex:1; padding:16px; display:flex; flex-direction:column; gap:8px;">
        <div style="font-size:12px; font-weight:700; color:#1e293b;">Check-in Rate</div>
        <div style="display:flex; align-items:baseline; gap:8px;">
          <div style="font-size:24px; font-weight:800; color:#0f172a;">78%</div>
          <div style="font-size:11px; color:#94a3b8;">201 of 258 checked in</div>
        </div>
        <div style="height:8px; background:#e2e8f0; border-radius:4px; overflow:hidden;"><div style="width:78%; height:100%; background:#334155;"></div></div>
      </div>
      <div class="card" style="flex:1; padding:16px; display:flex; flex-direction:column; gap:8px;">
        <div style="font-size:12px; font-weight:700; color:#1e293b;">Quota Fill Rate</div>
        <div style="display:flex; align-items:baseline; gap:8px;">
          <div style="font-size:24px; font-weight:800; color:#0f172a;">86%</div>
          <div style="font-size:11px; color:#94a3b8;">258 of 300 quota sold</div>
        </div>
        <div style="height:8px; background:#e2e8f0; border-radius:4px; overflow:hidden;"><div style="width:86%; height:100%; background:#334155;"></div></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {
      bars: [
        { h: '30%' }, { h: '45%' }, { h: '38%' }, { h: '60%' }, { h: '52%' },
        { h: '70%' }, { h: '90%' }, { h: '65%' }, { h: '48%' }, { h: '55%' },
      ],
    };
  }
}
</script>
</body>
</html>
